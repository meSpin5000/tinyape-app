<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 14 16" width="32" height="32">
  <!-- Same palette as the in-app pixel ape (app.js drawPixelApe): brown in
       light mode, cream when the browser/OS is in dark mode. -->
  <style>
    .b{fill:#8B4513}.d{fill:#5C2D0A}.t{fill:#D2A068}.e{fill:#ffffff}.p{fill:#1a1a1a}
    @media (prefers-color-scheme: dark){
      .b{fill:#f5e6d0}.d{fill:#b8a080}.t{fill:#c8b89a}.e{fill:#3a2a1a}.p{fill:#f5f0e6}
    }
  </style>
  <!-- Head -->
  <rect x="9" y="6" width="6" height="2" class="b"/>
  <rect x="8" y="7" width="1" height="2" class="b"/>
  <rect x="15" y="7" width="1" height="2" class="b"/>
  <rect x="8" y="8" width="8" height="2" class="b"/>
  <!-- Face -->
  <rect x="9" y="10" width="6" height="1" class="t"/>
  <rect x="10" y="11" width="4" height="1" class="t"/>
  <!-- Eyes -->
  <rect x="10" y="9" width="1" height="1" class="e"/>
  <rect x="11" y="9" width="1" height="1" class="p"/>
  <rect x="13" y="9" width="1" height="1" class="e"/>
  <rect x="14" y="9" width="1" height="1" class="p"/>
  <!-- Mouth -->
  <rect x="11" y="11" width="2" height="1" class="d"/>
  <!-- Ears -->
  <rect x="7" y="8" width="1" height="1" class="b"/>
  <rect x="7" y="9" width="1" height="1" class="d"/>
  <rect x="16" y="8" width="1" height="1" class="b"/>
  <rect x="16" y="9" width="1" height="1" class="d"/>
  <!-- Body -->
  <rect x="9" y="12" width="6" height="1" class="b"/>
  <rect x="9" y="13" width="1" height="1" class="b"/>
  <rect x="14" y="13" width="1" height="1" class="b"/>
  <rect x="10" y="13" width="4" height="1" class="d"/>
  <rect x="9" y="14" width="1" height="1" class="b"/>
  <rect x="14" y="14" width="1" height="1" class="b"/>
  <rect x="10" y="14" width="4" height="1" class="d"/>
  <rect x="9" y="15" width="1" height="1" class="b"/>
  <rect x="14" y="15" width="1" height="1" class="b"/>
  <rect x="10" y="15" width="4" height="1" class="d"/>
  <rect x="10" y="16" width="4" height="1" class="b"/>
  <!-- Arms (resting) -->
  <rect x="7" y="12" width="1" height="1" class="b"/>
  <rect x="6" y="13" width="1" height="1" class="b"/>
  <rect x="5" y="14" width="1" height="1" class="b"/>
  <rect x="16" y="12" width="1" height="1" class="b"/>
  <rect x="17" y="13" width="1" height="1" class="b"/>
  <rect x="18" y="14" width="1" height="1" class="b"/>
  <!-- Tail (resting curl) -->
  <rect x="15" y="15" width="1" height="1" class="b"/>
  <rect x="16" y="15" width="1" height="1" class="b"/>
  <rect x="17" y="14" width="1" height="1" class="b"/>
  <rect x="18" y="13" width="1" height="1" class="b"/>
  <!-- Legs -->
  <rect x="10" y="17" width="1" height="2" class="b"/>
  <rect x="9" y="19" width="2" height="1" class="d"/>
  <rect x="13" y="17" width="1" height="2" class="b"/>
  <rect x="13" y="19" width="2" height="1" class="d"/>
</svg>
